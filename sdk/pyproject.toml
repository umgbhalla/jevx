[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevx"
version = "0.1.0"
description = "Minimal Python SDK for Jev (TypeSafe System One decisions). Stdlib-only core."
requires-python = ">=3.13"

[project.optional-dependencies]
codex = ["openai-codex"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14", "ty>=0.0"]

[tool.hatch.build.targets.wheel]
packages = ["jevx"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Score["a", "b"] quotes are LOAD-BEARING level strings (UP037 would strip
# them into NameErrors); question text is data, not wrappable code.
"examples/*.py" = ["F821", "F722", "E501", "UP037"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ty.environment]
python-version = "3.13"

[tool.uv]
package = true
