[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jevx"
version = "0.1.0"
description = "Minimal Python SDK for Jev (TypeSafe System One decisions). Stdlib-only."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["jevx*"]
